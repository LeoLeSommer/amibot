appId: ${APP_ID}
name: Server settings on first launch
---
- launchApp:
    clearState: true
- assertVisible: "Settings"
- assertVisible: "Server"
- assertVisible: "Server URL"
- assertVisible:
    id: server-url-input
- assertVisible: "Not connected"
- assertVisible:
    id: server-connect
- assertVisible: "Appearance"
- assertVisible:
    id: appearance-settings
- assertVisible:
    id: theme-option-default
- assertVisible:
    id: mode-option-auto
- tapOn:
    id: theme-option-ocean
- tapOn:
    id: mode-option-dark
- assertVisible: "Appearance"
