url: ${BASE_URL}
name: Empty server and settings
---
- launchApp:
    clearState: true
- assertVisible: "No modules installed"
- assertVisible:
    id: home-empty-title
- tapOn:
    id: menu-toggle
- assertVisible:
    id: app-drawer
- assertVisible: "New conversation"
- tapOn:
    id: settings-open
- assertVisible: "Settings"
- assertVisible: "Server"
- assertVisible: "Server URL"
- assertVisible:
    id: settings-title
- assertVisible:
    id: server-url-input
- assertVisible:
    id: server-status
- assertVisible: "Appearance"
- assertVisible:
    id: appearance-settings
- assertVisible:
    id: theme-option-default
- assertVisible:
    id: mode-option-auto
- tapOn:
    id: theme-option-ocean
- tapOn:
    id: mode-option-dark
- assertVisible:
    id: settings-title
- tapOn:
    id: server-disconnect
- assertVisible: "Not connected"
- assertVisible:
    id: server-connect
