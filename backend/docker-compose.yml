services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amibot
      POSTGRES_PASSWORD: amibot
      POSTGRES_DB: amibot
    ports:
      - "5432:5432"
    volumes:
      - amibot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amibot -d amibot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amibot-db:
