[workspace]
members = ["crates/*", "modules/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
cargo_metadata = "0.18"
dotenvy = "0.15"
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-uuid",
    "with-chrono",
    "with-json",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "amibot-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "amibot-server"
path = "src/main.rs"

[dependencies]
amibot-core = { path = "crates/amibot-core" }
amibot-http = { path = "crates/amibot-http" }
amibot-migrations = { path = "crates/amibot-migrations" }
amibot-runtime = { path = "crates/amibot-runtime" }
amibot-schema = { path = "crates/amibot-schema" }
amibot-storage = { path = "crates/amibot-storage" }
anyhow.workspace = true
axum.workspace = true
dotenvy.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
cargo_metadata.workspace = true

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
