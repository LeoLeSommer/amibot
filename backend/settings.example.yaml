# Root settings for the Amibot server.
#
# This file is the authoritative source for server and module parameters. Copy
# it to settings.yaml (or point AMIBOT_SETTINGS_FILE at another path). It is
# committed with no secret values: secrets stay in the environment and are
# referenced only by name through ${VAR} / ${VAR:-default} interpolation.
#
#   ${VAR}          required; startup fails if the variable is unset
#   ${VAR:-default} optional; falls back to default when the variable is unset
#
# Interpolation runs on the parsed YAML tree, so an environment value that
# contains YAML-special characters cannot break parsing. Resolved values are
# never written to logs or error messages.

server:
  # Required. Keep the real value in .env (gitignored), never here.
  database_url: ${DATABASE_URL}
  # Address the HTTP server binds to.
  bind_addr: ${AMIBOT_BIND_ADDR:-0.0.0.0:3000}
  # Human-readable name advertised in the manifest.
  name: ${AMIBOT_SERVER_NAME:-Amibot}
  # Comma-separated CORS origins; "*" is rejected when credentials are on.
  allowed_origins: ${AMIBOT_ALLOWED_ORIGINS:-http://localhost:8081}
  # Directory of the embedded Expo Web build.
  web_dir: ${AMIBOT_WEB_DIR:-../frontend/dist}

chat:
  # Set to false to register no chat module (and mount no /chat routes).
  enabled: ${AMIBOT_CHAT_ENABLED:-true}
  provider: opencode-go
  base_url: https://opencode.ai/inference/go/openai/v1/chat/completions
  # Required only to make real completions; keep it in .env, never here.
  api_key: ${OPENCODE_GO_API_KEY:-}
  models:
    - id: glm-5.3-flash
      label: GLM 5.3 Flash
    - id: glm-5.3
      label: GLM 5.3
  default_model: glm-5.3-flash
  preprompt: "You are a helpful assistant. Answer clearly and concisely. If you do not know, say so."
