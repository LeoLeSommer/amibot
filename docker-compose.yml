services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amibot
      POSTGRES_PASSWORD: amibot
      POSTGRES_DB: amibot
    volumes:
      - amibot-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amibot -d amibot"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://amibot:amibot@db:5432/amibot
      AMIBOT_SERVER_NAME: Amibot
      AMIBOT_ALLOWED_ORIGINS: http://localhost:8081
      RUST_LOG: info
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  amibot-db:
